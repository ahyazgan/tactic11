name: frontend-e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: install playwright browsers
        run: npx playwright install --with-deps chromium

      - name: run E2E (backend-independent smoke)
        env:
          # Backend olmadan static smoke testler
          E2E_BACKEND: "false"
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 30000
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  live_auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build the real API mode
        env:
          API_BASE_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_DEMO_MODE: "false"
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Login and video authorization UI (mocked API)
        env:
          E2E_LIVE_API: "true"
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 30000
          npx playwright test e2e/live_auth.spec.ts --workers=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install review API dependencies
        working-directory: .
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Real video, approval, PDF, clips and private browser cache
        working-directory: .
        env:
          DATABASE_URL: "sqlite:///./.cache/review-e2e-ci.db"
          REVIEW_DATA_DIR: ".cache/review-e2e-media"
          DEV_DEFAULT_TENANT_ID: "t-default"
          E2E_REVIEW_BACKEND: "true"
          E2E_REVIEW_VIDEO: "${{ github.workspace }}/.cache/review-e2e-source.mp4"
        run: |
          mkdir -p .cache
          python -m alembic upgrade head
          python -m scripts.review_e2e_setup --video "$E2E_REVIEW_VIDEO"
          uvicorn app.api.main:app --host 127.0.0.1 --port 8000 --no-access-log > .cache/review-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          cd frontend
          if ! npx wait-on http-get://127.0.0.1:8000/health -t 30000; then
            cat ../.cache/review-api.log
            exit 1
          fi
          npx playwright test e2e/match_reports.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-auth-report
          path: frontend/test-results/
          retention-days: 7
