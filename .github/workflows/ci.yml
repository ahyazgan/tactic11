name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR'a tekrar push gelirse çalışan job'u iptal et — quota tasarrufu.
# main push/re-run'larında İPTAL ETME: aksi halde merge'ler ve re-run'lar
# aynı concurrency grubunda birbirini cancel'lar (yeşile dönemez).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: ruff
        run: ruff check app/ scripts/ tests/
      - name: mypy
        run: mypy app/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        run: pytest -q

  tracker_backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research trackers (no detector or ReID model)
        run: pip install pytest numpy==2.3.5 scipy==1.15.3 supervision==0.30.2 trackers==2.6.0 filterpy==1.4.5 "pydantic>=2,<3"
      - name: Check real backends and evidence preservation
        run: |
          python -c "from trackers import BoTSORTTracker, OCSORTTracker, ByteTrackTracker; import supervision"
          pytest --noconftest -q tests/test_tracker_backend_benchmark.py tests/test_deepocsort.py tests/test_tracking_reid_integration.py
          pytest --noconftest -q tests/test_identity_failure_audit.py

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: alembic upgrade head (sqlite smoke)
        env:
          DATABASE_URL: "sqlite:///./_ci.db"
        run: alembic upgrade head
      - name: alembic downgrade base + upgrade head (roundtrip)
        env:
          DATABASE_URL: "sqlite:///./_ci.db"
        run: |
          alembic downgrade base
          alembic upgrade head

  postgres_identity_migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: identity_test
          POSTGRES_PASSWORD: identity_test
          POSTGRES_DB: identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity_test -d identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: install
        run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: PostgreSQL external player identity migration and rollback
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+psycopg://identity_test:identity_test@localhost:5432/identity_test"
        run: pytest -q tests/test_player_external_id_bigint.py tests/test_migration_bootstrap.py tests/test_migration_boolean_defaults.py -k postgresql

  docker_build:
    runs-on: ubuntu-latest
    # Dockerfile değişirse veya main'e merge'de doğrula; PR'larda da
    # opsiyonel ama hızlı (Docker layer cache).
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # docker driver = daemon'ın gömülü buildkit'i; moby/buildkit imajı
          # Docker Hub'dan ÇEKİLMEZ → flaky 'pulling buildkit ... timeout' yok.
          driver: docker
      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tactic11:ci
          # NOT: gha cache (type=gha) docker driver'da desteklenmez; reliability
          # için layer cache'ten feragat edildi (smoke build hızlı zaten).
      - name: smoke — image starts
        run: |
          # Container short-lived: just verify entrypoint module imports.
          # DATABASE_URL fake (no real DB) — uvicorn boot olmaz ama import OK olmalı.
          docker run --rm --entrypoint python tactic11:ci -c \
            "import app.api.main; print('import ok, version=', app.api.main.APP_VERSION)"
